[project]
name = "webscrapping"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VSCode User", email = "user@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pandas>=3.0.5",
    "requests>=2.34.2",
]

[project.scripts]
webscrapping = "webscrapping:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
